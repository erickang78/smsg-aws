<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#244e3b"><title>일조해(SMSG)</title><link rel="stylesheet" href="/static/style.css"><script defer src="/static/app.js"></script></head><body><main><header><div class="brand">S</div><div><small>함께하는 일요일</small><h1>일조해 <span>SMSG</span></h1></div><div class="header-actions"><button id="password-change" hidden>비밀번호 변경</button><button id="logout" hidden>로그아웃</button></div></header><section id="login" class="card"><h2>우리 모임의 공간</h2><p>멤버부터 라운딩, 식사 정산까지 한곳에서.</p><form id="loginform"><label>모임 비밀번호<input type="password" name="password" autocomplete="current-password" required></label><button class="primary">장부 열기</button></form></section><div id="app" hidden><section class="hero"><small>Sunday morning screen golf</small><h2>좋은 사람들과,<br>즐거운 일요일.</h2><div><span id="membercount">0명의 멤버</span><span>모임 잔액 <b id="balance">0원</b></span></div></section><nav aria-label="주 메뉴"><button data-tab="members" class="selected">멤버</button><button data-tab="games">경기</button><button data-tab="courses">코스</button><button data-tab="meals">식대정산</button></nav><section id="content"></section></div><p id="status" role="status"></p><footer>일조해(SMSG) · 우리 모임의 기록</footer></main><dialog id="editor"><div class="dialoghead"><h2 id="dialogtitle"></h2><button id="close" aria-label="닫기">✕</button></div><form id="editform"></form></dialog></body></html>
